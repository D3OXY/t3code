<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>T3 Glass</title>
    <script>
      // Apply the stored appearance before React mounts so the first paint
      // already has the right theme and wallpaper (no light/dark flash).
      (() => {
        try {
          const raw = localStorage.getItem("glass:appearance:v1");
          const state = raw ? JSON.parse(raw).state : null;
          const mode = state?.mode ?? "dark";
          const dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.dataset.wallpaper = state?.wallpaper ?? "dusk";
          document.documentElement.dataset.surface = state?.surface ?? "frost";
        } catch {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-hidden="true">
        <div class="boot-wave">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span
          ><span></span><span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
